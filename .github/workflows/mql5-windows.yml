name: MQL5 Windows Verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mql5-verification:
    name: MQL5 compile + automated tests (MetaTrader)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse local official campaign script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\run-local-official-campaign.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List *
            throw "Windows PowerShell 5.1 parser rejected the local campaign script."
          }
          Write-Host "POWERSHELL 5.1 PARSER PASS"

      - name: Install MetaTrader 5 and compile GoldenTradeX.mq5
        shell: pwsh
        run: .github/scripts/compile-mql5.ps1

      - name: Compile v3.1 opportunity shadow expert
        shell: pwsh
        run: .github/scripts/compile-opportunity-shadow.ps1

      - name: Compile and execute MQL5 test suite
        shell: pwsh
        run: .github/scripts/verify-mql5-tests.ps1

      - name: Upload MetaEditor build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mql5-metaeditor-build
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ env.GTX_COMPILE_LOG }}
            ${{ env.GTX_EX5 }}
            ${{ env.GTX_SHADOW_COMPILE_LOG }}
            ${{ env.GTX_SHADOW_EX5 }}

      - name: Upload MQL5 test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mql5-automated-tests
          retention-days: 30
          if-no-files-found: warn
          path: ${{ env.GTX_MQL5_TEST_EVIDENCE }}

  mql5-required:
    name: MQL5 required gate
    if: always()
    needs: [mql5-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce MetaTrader verification result
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.mql5-verification.result }}" = "success"
          echo "MQL5 REQUIRED GATE PASS"
