name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit declared Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  dependency-review:
    name: Dependency review capability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Detect Dependency Graph availability
        id: depgraph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --output /tmp/gtx-sbom.json \
            --write-out "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "Dependency Graph available — dependency review is blocking."
          elif [ "$code" = "403" ] || [ "$code" = "404" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Graph is disabled/unavailable; Dependency Review cannot be enforced yet."
          else
            echo "Unexpected Dependency Graph API status: $code"
            cat /tmp/gtx-sbom.json || true
            exit 1
          fi
      - name: Review dependency changes
        if: steps.depgraph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
      - name: Record external security gap
        if: steps.depgraph.outputs.supported != 'true'
        run: |
          echo "DEPENDENCY_REVIEW=BLOCKED_EXTERNAL"
          echo "Enable GitHub Dependency Graph to make dependency-review-action a blocking gate."
