name: Materialize Official Economic Calendar

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First completed release year to materialize
        required: true
        default: "2021"
        type: string
      end_year:
        description: Last completed release year to materialize (GTX-WF-V1 ends 2026-01-01 exclusive)
        required: true
        default: "2025"
        type: string
      source_dir:
        description: Repository-relative immutable official source snapshot directory
        required: true
        default: data/research/calendar-sources/v1
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize-calendar:
    name: Verified offline BLS + Federal Reserve calendar artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Validate frozen historical range and source path
        shell: bash
        env:
          GTX_START_YEAR: ${{ inputs.start_year }}
          GTX_END_YEAR: ${{ inputs.end_year }}
          GTX_SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          [[ "$GTX_START_YEAR" =~ ^20[0-9]{2}$ ]]
          [[ "$GTX_END_YEAR" =~ ^20[0-9]{2}$ ]]
          test "$GTX_START_YEAR" -le "$GTX_END_YEAR"
          test "$GTX_START_YEAR" -ge 2000
          test "$GTX_END_YEAR" -le 2100
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path

          plan = json.loads(Path("config/walk_forward_plan.v1.json").read_text(encoding="utf-8"))
          start = datetime.strptime(plan["start_date"], "%Y-%m-%d")
          end_exclusive = datetime.strptime(plan["end_date"], "%Y-%m-%d")
          if end_exclusive <= start:
              raise SystemExit("walk-forward end_date must be after start_date")
          expected = (start.year, (end_exclusive - timedelta(days=1)).year)
          requested = (int(os.environ["GTX_START_YEAR"]), int(os.environ["GTX_END_YEAR"]))
          if requested != expected:
              raise SystemExit(
                  "Calendar materialization range must match frozen GTX-WF-V1 half-open window: "
                  f"expected {expected[0]}-{expected[1]}, got {requested[0]}-{requested[1]}"
              )

          repo = Path.cwd().resolve()
          raw = os.environ["GTX_SOURCE_DIR"].strip()
          source = (repo / raw).resolve()
          try:
              source.relative_to(repo)
          except ValueError as exc:
              raise SystemExit("source_dir must remain inside repository checkout") from exc
          if not source.is_dir():
              raise SystemExit(
                  "immutable source snapshot directory is missing; capture and commit/retrieve "
                  "the reviewed BLS/Federal Reserve snapshot bundle before materialization"
              )
          manifest = source / "source_manifest.json"
          if not manifest.is_file():
              raise SystemExit("source_manifest.json is required; network fallback is forbidden")
          print(f"OFFLINE SNAPSHOT INPUT READY: {source}")
          PY

      - name: Install exact parser dependency
        run: python -m pip install --disable-pip-version-check "requests==2.34.2"

      - name: Verify immutable manifest and materialize unapproved calendar
        env:
          GTX_START_YEAR: ${{ inputs.start_year }}
          GTX_END_YEAR: ${{ inputs.end_year }}
          GTX_SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          python scripts/materialize_verified_official_calendar.py \
            --start-year "$GTX_START_YEAR" \
            --end-year "$GTX_END_YEAR" \
            --source-dir "$GTX_SOURCE_DIR" \
            --output data/research/calendar-review/economic_calendar.generated.json \
            --audit-output data/research/calendar-review/economic_calendar.audit.json

      - name: Validate generated contract and render MQL5 include
        run: |
          python scripts/economic_calendar_contract.py \
            --contract data/research/calendar-review/economic_calendar.generated.json \
            --generate-mql5 data/research/calendar-review/EconomicCalendarData.generated.mqh
          python scripts/economic_calendar_contract.py \
            --contract data/research/calendar-review/economic_calendar.generated.json \
            --verify-mql5 data/research/calendar-review/EconomicCalendarData.generated.mqh

      - name: Enforce non-evidence review boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path("data/research/calendar-review/economic_calendar.generated.json").read_text(encoding="utf-8")
          )
          audit = json.loads(
              Path("data/research/calendar-review/economic_calendar.audit.json").read_text(encoding="utf-8")
          )
          if document.get("approved") is not False:
              raise SystemExit("Generated calendar must remain approved=false until reviewed")
          if audit.get("source_manifest_verified") is not True:
              raise SystemExit("Source manifest verification is mandatory")
          if audit.get("live_trading_authorized") is not False:
              raise SystemExit("Calendar review must deny live trading")
          if audit.get("real_capital_authorized") is not False:
              raise SystemExit("Calendar review must deny real capital")
          print("VERIFIED OFFLINE CALENDAR REVIEW ARTIFACT READY; APPROVAL NOT GRANTED")
          PY

      - name: Upload reviewable calendar evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: official-economic-calendar-review-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: data/research/calendar-review/
