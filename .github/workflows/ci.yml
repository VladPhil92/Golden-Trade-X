name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-integrity:
    name: Dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install complete supported environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify dependency resolver state
        run: pip check
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Environment smoke tests
        run: pytest tests/test_environment.py -v --tb=short

  security-scan:
    name: Tracked secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanner test dependency
        run: pip install "pytest~=9.1"
      - name: Scan tracked repository content
        run: python scripts/security_scan.py
      - name: Scanner regression tests
        run: pytest tests/test_security_scan.py -v --tb=short

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Ruff
        run: pip install "ruff==0.15.8"
      - name: Ruff critical rules
        run: ruff check scripts/ tests/ --line-length 120 --select E4,E7,E9,F

  mql5-lint:
    name: MQL5 static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint MQL5 sources
        run: python scripts/mql5_lint.py

  config-validate:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate presets and cross-preset invariants
        run: python scripts/validate_set.py config/GoldenTradeX.set config/GoldenTradeX_XAGUSD.set

  structure-check:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required files exist
        run: |
          missing=0
          for f in \
            "MQL5/Experts/GoldenTradeX/GoldenTradeX.mq5" \
            "MQL5/Include/GoldenTradeX/SignalEngine.mqh" \
            "MQL5/Include/GoldenTradeX/RiskManager.mqh" \
            "MQL5/Include/GoldenTradeX/SessionFilter.mqh" \
            "MQL5/Include/GoldenTradeX/NewsFilter.mqh" \
            "MQL5/Include/GoldenTradeX/TradeLogger.mqh" \
            "MQL5/Include/GoldenTradeX/MarketRegimeEngine.mqh" \
            "MQL5/Include/GoldenTradeX/SmartMoneyEngine.mqh" \
            "MQL5/Include/GoldenTradeX/ConfidenceEngine.mqh" \
            "MQL5/Include/GoldenTradeX/FibonacciEngine.mqh" \
            "MQL5/Include/GoldenTradeX/PartialTakeProfit.mqh" \
            "MQL5/Include/GoldenTradeX/EquityCurveFilter.mqh" \
            "MQL5/Include/GoldenTradeX/OrderManager.mqh" \
            "MQL5/Include/GoldenTradeX/HealthMonitor.mqh" \
            "MQL5/Include/GoldenTradeX/PositionStateManager.mqh" \
            "MQL5/Scripts/Tests/TestOrderManager.mq5" \
            "MQL5/Scripts/Tests/TestNewsFilter.mq5" \
            "MQL5/Scripts/Tests/TestRiskManager.mq5" \
            "MQL5/Scripts/Tests/TestMarketRegime.mq5" \
            "MQL5/Scripts/Tests/TestSessionFilter.mq5" \
            "MQL5/Scripts/Tests/TestFibonacci.mq5" \
            "MQL5/Scripts/Tests/TestPositionState.mq5" \
            "scripts/monitor.py" \
            "scripts/backtest_analysis.py" \
            "scripts/regime_analysis.py" \
            "scripts/ml_pipeline.py" \
            "scripts/validate_set.py" \
            "scripts/correlation_engine.py" \
            "scripts/optimize_confidence.py" \
            "scripts/fomc_calendar.py" \
            "scripts/session_analyzer.py" \
            "scripts/walk_forward_optimizer.py" \
            "scripts/live_monitor.py" \
            "scripts/mql5_lint.py" \
            "scripts/performance_report.py" \
            "scripts/security_scan.py" \
            "tests/test_backtest_analysis.py" \
            "tests/test_backtest_io.py" \
            "tests/test_performance_report.py" \
            "tests/test_performance_io.py" \
            "tests/test_environment.py" \
            "tests/test_ml_pipeline.py" \
            "tests/test_mql5_lint.py" \
            "tests/test_validate_set.py" \
            "tests/test_security_scan.py" \
            ".github/scripts/compile-mql5.ps1" \
            ".github/scripts/verify-mql5-tests.ps1" \
            ".github/CODEOWNERS" \
            "CONTRIBUTING.md" \
            "SECURITY.md" \
            ".coveragerc" \
            ".env.example" \
            "dashboard/index.html" \
            "config/GoldenTradeX.set" \
            "config/GoldenTradeX_XAGUSD.set" \
            "requirements.txt" \
            "CHANGELOG.md" \
            "docs/CI.md" \
            "docs/STRATEGY.md" \
            "docs/ARCHITECTURE.md"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "OK:      $f"
            fi
          done
          exit $missing

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: EA version matches CHANGELOG latest entry
        run: |
          ea_ver=$(grep -m1 '#property version' \
            MQL5/Experts/GoldenTradeX/GoldenTradeX.mq5 \
            | grep -oP '"\K[^"]+')
          cl_ver=$(grep -m1 '^## \[' CHANGELOG.md \
            | grep -oP '\[\K[^\]]+')
          echo "EA version:        $ea_ver"
          echo "CHANGELOG latest:  $cl_ver"
          if [ "$ea_ver" != "$cl_ver" ]; then
            echo "Version mismatch — update CHANGELOG.md or GoldenTradeX.mq5"
            exit 1
          fi

  python-tests:
    name: Python tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Verify installed dependencies
        run: pip check
      - name: Run unit tests with coverage gate
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
        run: |
          pytest tests/ --ignore=tests/test_ml_pipeline.py -v --tb=short \
            --cov=scripts.backtest_analysis \
            --cov=performance_report \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

  ml-compatibility:
    name: ML compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: XGBoost/scikit-learn train-predict-save-load smoke test
        run: pytest tests/test_ml_pipeline.py -v --tb=short

  dashboard-check:
    name: Dashboard HTML valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check dashboard exists and references Chart.js
        run: |
          if ! grep -q "chart.js" dashboard/index.html; then
            echo "FAIL: dashboard/index.html missing Chart.js reference"
            exit 1
          fi
          echo "OK: dashboard/index.html valid"
